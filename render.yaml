services:
  - type: web
    name: audiobite-ai-companion
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: AI_RUNTIME_MODE
        value: "cloud"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMMA_CLOUD_ENDPOINT
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: GEMMA_CLOUD_MODEL
        value: "gemma-4-31b-it"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_ENDPOINT
        value: "https://openrouter.ai/api/v1"
      - key: OPENROUTER_MODEL
        value: "google/gemma-4-31b-it:free"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "1.0"
      - key: CUSTOM_TECH_DOMAIN
        value: "audiobite.tech"
      - key: TABPFN_MODE
        value: "local"
      - key: CHECKOUT_OR_WAITLIST_URL
        value: "https://www.buymeacoffee.com/kakeroth"
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: "audiobite_verify"
