services:
  - type: web
    name: audiobite-ai-companion
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: AI_RUNTIME_MODE
        value: "cloud"
      - key: DO_INFERENCE_API_KEY
        sync: false
      - key: DO_MODEL_ENDPOINT
        value: "https://inference.do-ai.run/v1"
      - key: DO_MODEL_ID
        value: "google-gemma-4-31b-it"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "1.0"
      - key: CUSTOM_TECH_DOMAIN
        value: "audiobite.tech"
      - key: TABPFN_MODE
        value: "local"
